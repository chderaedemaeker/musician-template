[build]
  command = "npm install && npx @11ty/eleventy"
  publish = "_site"
  # Builds run only on demand: triggered from the admin's "Publish site"
  # button (a build hook, which sets INCOMING_HOOK_TITLE) or by a commit
  # whose message contains [publish]. Ordinary pushes are skipped (exit 0).
  ignore = "test -z \"$INCOMING_HOOK_TITLE\" && ! git log -1 --pretty=%B | grep -q '\\[publish\\]'"

[functions]
  directory = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The admin must always load matching fresh assets
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Cache optimized images
[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Language redirects are generated at build time into _site/_redirects
# from the enabled languages in _input/_data/site.json (admin Site settings).

# Projects was renamed to Ensembles
[[redirects]]
  from = "/en/projects/*"
  to = "/en/ensembles/:splat"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/ensembles/:splat"
  status = 301
