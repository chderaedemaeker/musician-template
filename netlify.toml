[build]
  command = "npm install && npx @11ty/eleventy"
  publish = "_site"

[functions]
  directory = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The admin must always load matching fresh assets
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Cache optimized images
[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Language redirects — detect browser language, English is the default
[[redirects]]
  from = "/"
  to = "/nl"
  status = 302
  force = true
  conditions = {Language = ["nl"]}

[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/de"
  status = 302
  force = true
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true

# Projects was renamed to Ensembles
[[redirects]]
  from = "/en/projects/*"
  to = "/en/ensembles/:splat"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/ensembles/:splat"
  status = 301
