backend:
  name: git-gateway
  branch: master
local_backend: true

media_folder: '_input/images'
public_folder: '/images'
audio_folder: '_input/audio'
public_audio_folder: '/audio'
locale: 'en'
show_preview_links: true

i18n:
  structure: multiple_folders
  locales: [en, nl, fr, de]
  default_locale: en

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"

collections:

  - label: "Concerts"
    name: "concerts"
    folder: "_input/en/concerts"
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    create: true
    editor:
      preview: true
    summary: '{{date}} — {{title}} - {{place}}'
    sortable_fields: ['date', 'title']
    sort: 'date:desc'
    preview_path: "en/concerts/{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true, hint: "The name of the concert as shown on the site, e.g. \"Recital\" or \"Four Seasons\"."}
      - {label: "Date", name: "date", widget: "datetime", required: true, default: "", format: "YYYY-MM-DDTHH:mm:ss", picker_utc: false, hint: "Leave the time at 00:00 if the concert has no specific hour — it will be hidden on the site."}
      - {label: "End date (optional)", name: "date_end", widget: "datetime", required: false, default: "", format: "YYYY-MM-DDTHH:mm:ss", picker_utc: false, hint: "Only for concerts spanning multiple days, e.g. 12–16 August."}
      - {label: "Month and year only", name: "month_only", widget: "boolean", required: false, default: false, hint: "Turn on when the exact day isn't known yet — the site shows only \"August 2026\". Set the date to any day in that month."}
      - {label: "Place", name: "place", widget: "string", required: false, autocomplete: true, hint: "City and country, e.g. \"Ghent, Belgium\". Start typing to reuse a place from earlier concerts."}
      - {label: "Composers", name: "composers", widget: "string", required: false, autocomplete: true, hint: "Composers on the programme, separated by commas, e.g. \"Bach, Ysaÿe\"."}
      - {label: "Collaborators", name: "collaborators", widget: "string", required: false, autocomplete: true, hint: "Who plays with you, e.g. \"Duo Altiler (Alexander Declercq - Piano)\"."}
      - {label: "Link", name: "link", widget: "string", required: false, hint: "Web address for tickets or more information. Shown as a \"Tickets & Info\" button."}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, hint: "Turn on to give this concert extra attention in the list: more space and the blue accent background."}
      - {label: "Extra links", name: "links", widget: "links", required: false, hint: "Optional extra buttons at the bottom of the concert page. Give each one a short name (what visitors will read) and the full web address."}
      - {label: "Additional information", name: "body", widget: "markdown", required: false, hint: "Free text shown on the concert page: programme, background, anything visitors should know."}

  - label: "Notes"
    name: "notes"
    folder: "_input/en/notes"
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    create: true
    editor:
      preview: true
    summary: '{{date}} — {{title}}'
    sortable_fields: ['date', 'title']
    sort: 'date:desc'
    fields:
      - {label: "Title", name: "title", widget: "string", required: true, hint: "The title of your note."}
      - {label: "Date", name: "date", widget: "datetime", required: true, default: "", format: "YYYY-MM-DDTHH:mm:ss", picker_utc: false, hint: "When you wrote it — notes are shown newest first."}
      - {label: "Text", name: "body", widget: "markdown", required: true, hint: "Your note — as short or long as you like. Personal, in your own words."}
      - {label: "Photos", name: "photos", widget: "images", required: false, hint: "Optional photos for this note — they appear as a loose stack of pictures under the text. One photo is shown on its own."}
      - {label: "Extra links", name: "links", widget: "links", required: false, hint: "Optional buttons at the bottom of the note."}

  - label: "Ensembles"
    name: "projects"
    folder: "_input/ensembles"
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    create: true
    i18n: true
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string", required: true, i18n: duplicate, hint: "The name of the ensemble or project."}
      - {label: "Collaborators", name: "collaborators", widget: "string", required: false, i18n: true, hint: "The members or partners, e.g. \"Alexander Declercq - Piano\"."}
      - {label: "Image", name: "image", widget: "image", required: true, i18n: duplicate, hint: "A photo for the project. It appears on the project cards and at the top of the page."}
      - {label: "Concert match words", name: "match", widget: "string", required: false, hint: "Words used to find this project's concerts, separated by commas, e.g. \"duo altiler, altiler\". Concerts whose title or collaborators contain one of these words appear on the project page automatically."}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, i18n: duplicate, hint: "Turn on to make this card twice as wide with the blue accent background — for the things that deserve extra attention."}
      - {label: "Extra links", name: "links", widget: "links", required: false, hint: "Buttons at the bottom of the project page, e.g. the ensemble's website or Instagram."}
      - {label: "Additional information", name: "body", widget: "markdown", required: false, i18n: true, hint: "The story of the project: who, what, since when."}

  - label: "Highlights"
    name: "highlights"
    folder: "_input/highlights"
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    create: true
    i18n: true
    fields:
      - {label: "Title", name: "title", widget: "string", required: true, i18n: true, hint: "The name of the highlight, e.g. a recording, video or special concert."}
      - {label: "Date", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DDTHH:mm:ss", time_format: false, picker_utc: false, i18n: duplicate, hint: "Highlights are shown newest first — the date decides the order."}
      - {label: "Type", name: "type", widget: "string", required: false, i18n: duplicate, hint: "A short word for what this is: \"Video\", \"Recording\", \"CD release\"…"}
      - {label: "Thumbnail", name: "image", widget: "image", required: true, i18n: duplicate, hint: "The photo on the highlight card. Required — highlights without a photo look empty."}
      - {label: "Hide photo on the page", name: "hide_image", widget: "boolean", required: false, default: false, i18n: duplicate, hint: "The photo stays on the highlight card, but is not shown on the highlight's own page — handy when the page is mainly audio or text."}
      - {label: "Youtube ID", name: "link", widget: "string", required: false, i18n: duplicate, hint: "Only the code after watch?v= in a YouTube address, e.g. \"XSOi7_MJnqI\". The video then replaces the photo on the page."}
      - {label: "Place", name: "place", widget: "string", required: false, i18n: duplicate}
      - {label: "Collaborators", name: "collaborators", widget: "string", required: false, i18n: duplicate}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, i18n: duplicate, hint: "Turn on to make this card twice as wide with the blue accent background — for the things that deserve extra attention."}
      - {label: "Extra links", name: "links", widget: "links", required: false, hint: "Buttons at the bottom of the page, e.g. \"Listen on SoundCloud\" with the web address."}
      - {label: "Additional information", name: "body", widget: "markdown", required: false, i18n: true}

  - label: "About"
    name: "about"
    folder: "_input/about"
    i18n:
      structure: multiple_files
    slug: 'about'
    fields:
      - {label: "Title", name: "title", widget: "string", required: true, i18n: true}
      - {label: "Gallery photo 1", name: "gallery1", widget: "image", required: false, i18n: true, hint: "The photos that slide by at the top of the About page. Leave all four empty to keep the standard photos."}
      - {label: "Gallery photo 2", name: "gallery2", widget: "image", required: false, i18n: true, hint: "Second gallery photo. Leave empty to skip."}
      - {label: "Gallery photo 3", name: "gallery3", widget: "image", required: false, i18n: true, hint: "Third gallery photo. Leave empty to skip."}
      - {label: "Gallery photo 4", name: "gallery4", widget: "image", required: false, i18n: true, hint: "Fourth gallery photo. Leave empty to skip."}
      - {label: "Short Bio", name: "summaryabout", widget: "markdown", i18n: true}
      - {label: "Bio", name: "body", widget: "markdown", i18n: true}
