<!DOCTYPE html>
<html lang="{{ page.lang }}" dir="{{ languages[page.lang].dir | default: 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ title }}">
    <title>{{ title }} — {{ languages[page.lang].site_title }}</title>
    {% include "css.liquid" %}
</head>
<body>

{% include "navigation.liquid" %}

<main>
  <div class="about-page">
    <h1>{{ title }}</h1>
    <div class="content">
      {{ content }}
    </div>
  </div>
</main>

{% include "footer.liquid" %}
</body>
</html>
