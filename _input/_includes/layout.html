<!DOCTYPE html>
<html lang="{{ page.lang }}" dir="{{ languages[page.lang].dir | default: 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description | default: '' }}">
    <title>{% if title %}{{ title }} — {% endif %}{{ languages[page.lang].site_title }}</title>
    {% include "css.liquid" %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    {{ content }}
    {% include "footer.liquid" %}
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    <script>
      (function () {
        /* Swap src immediately so the browser renders progressive JPEG
           scan passes natively: pixelated first scan → crisp final. */
        function loadFull(img) {
          if (img.dataset.srcset) img.srcset = img.dataset.srcset;
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          img.removeAttribute('data-srcset');
        }

        function init() {
          var imgs = document.querySelectorAll('img.prog-img[data-src]');
          if (!imgs.length) return;
          if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) { loadFull(e.target); io.unobserve(e.target); }
              });
            }, { rootMargin: '200px' });
            imgs.forEach(function (img) { io.observe(img); });
          } else {
            imgs.forEach(loadFull);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
</body>
</html>
